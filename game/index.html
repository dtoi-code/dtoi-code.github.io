<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏中心 - DTOI守夜人团队</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
            transition: all 0.3s ease;
        }

        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --nav-bg: #f8f9fa;
            --card-bg: #e9ecef;
            --primary: #007bff;
            --btn-bg: #007bff;
            --btn-text: #fff;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --nav-bg: #2d2d2d;
            --card-bg: #3d3d3d;
            --primary: #4dabf7;
            --btn-bg: #4dabf7;
            --btn-text: #000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 40px;
        }

        .top-left {
            position: fixed;
            top: 5px;
            left: 30px;
            font-size: 18px;
            font-weight: bold;
            z-index: 999;
        }

        .nav {
            position: fixed;
            top: 10px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 999;
        }

        .nav a {
            text-decoration: none;
            font-size: 16px;
            color: var(--text-color);
            cursor: pointer;
        }

        .nav a.active {
            color: var(--primary);
            font-weight: bold;
        }

        .theme-switch {
            width: 50px;
            height: 24px;
            background-color: #ccc;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .theme-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }

        [data-theme="dark"] .theme-switch::after {
            left: 28px;
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
            padding-top: 60px;
        }

        .page-title {
            font-size: 32px;
            margin-bottom: 50px;
        }

        .game-card {
            background: var(--card-bg);
            width: 280px;
            margin: 0 auto;
            padding: 30px 20px;
            border-radius: 12px;
        }

        .game-name {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .enter-btn {
            padding: 10px 28px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .enter-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="top-left">DTOI守夜人团队</div>
    <div class="nav"></div>

    <div class="container">
        <h2 class="page-title">游戏中心</h2>
        <div class="game-card">
            <div class="game-name">贪吃蛇</div>
            <button class="enter-btn" onclick="location.href='/game/snake'">进入游戏</button>
        </div>
    </div>

    <script src="../nav-config.js"></script>
    <script>
        // 标记当前游戏菜单激活高亮
        window.currentNav = "game";
    </script>
</body>
</html>
